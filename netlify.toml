# Build Netlify : Vite génère dist/ (accueil + pages 404 farm/, gear/, chapters/, crew/)
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Fichiers hachés par Vite : cache long
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
