<script>
  // Cache les éléments animés jusqu'à ce que la timeline GSAP prenne le relais
  // (jamais en mouvement réduit ; filet de sécurité à 3 s).
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
    document.documentElement.classList.add('pre');
    setTimeout(() => document.documentElement.classList.remove('pre'), 3000);
  }
</script>
